<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookify</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--text:#1f2a28;--muted:#5d6b68;--accent:#0f6e56;--accent-text:#fff;--border:#d9d6cd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17201e;--card:#1f2b28;--text:#eef2f0;--muted:#a3b2ae;--accent:#5dcaa5;--accent-text:#04342c;--border:#34443f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17201e;--card:#1f2b28;--text:#eef2f0;--muted:#a3b2ae;--accent:#5dcaa5;--accent-text:#04342c;--border:#34443f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:32px 20px}
h1{margin:0 0 4px;font-size:28px}
p.sub{margin:0 0 24px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
label{display:block;font-size:14px;margin:0 0 6px;color:var(--muted)}
input,select{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:14px}
button{padding:10px 18px;font-size:16px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-text);cursor:pointer}
#echo{margin-top:20px;padding:14px;border-radius:8px;border:1px dashed var(--border);min-height:48px}
#err{color:#c0392b;font-size:14px;min-height:20px;margin:-6px 0 10px}
ul{list-style:none;margin:20px 0 0;padding:0}
li{padding:10px 0;border-top:1px solid var(--border)}
li span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Bookify</h1>
<p class="sub">Add a book to your shelf and see it echoed back instantly.</p>
<div class="card">
<label for="title">Book title</label>
<input id="title" type="text" placeholder="e.g. Abai Joly" autocomplete="off">
<label for="shelf">Shelf</label>
<select id="shelf">
<option>Want to read</option>
<option>Currently reading</option>
<option>Finished</option>
</select>
<div id="err" role="alert"></div>
<button id="add" type="button">Add to shelf</button>
<div id="echo" aria-live="polite">You haven’t added anything yet.</div>
<ul id="list"></ul>
</div>
</main>
<script>
var t=document.getElementById('title'),s=document.getElementById('shelf'),e=document.getElementById('echo'),l=document.getElementById('list'),er=document.getElementById('err');
function add(){
var v=t.value.trim();
if(!v){er.textContent='Enter a book title first.';return}
er.textContent='';
e.textContent='You entered: “'+v+'” — saved to “'+s.value+'”.';
var li=document.createElement('li');
li.textContent=v+' ';
var sp=document.createElement('span');
sp.textContent='· '+s.value;
li.appendChild(sp);
l.insertBefore(li,l.firstChild);
t.value='';t.focus();
}
document.getElementById('add').addEventListener('click',add);
t.addEventListener('keydown',function(ev){if(ev.key==='Enter')add()});
t.addEventListener('input',function(){er.textContent=''});
</script>
</body>
</html>
